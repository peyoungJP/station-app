name: QA Pipeline

# push または PR (main ブランチ) をトリガーにパイプラインを実行する
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Flutter バージョンは pubspec.yaml の sdk: ^3.11.0 に合わせ stable チャンネルを使用
  FLUTTER_CHANNEL: stable

jobs:
  # ──────────────────────────────────────────────
  # ① Unit & Widget テスト
  # ──────────────────────────────────────────────
  unit-test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: latest

      - name: 依存関係インストール
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze --no-fatal-infos

      - name: テスト実行（JSON 出力）
        # || true で失敗しても後続ステップを継続する
        run: |
          mkdir -p test-results allure-results
          flutter test --reporter json 2>&1 | tee test-results/unit-results.json || true

      - name: JUnit XML へ変換
        run: |
          python3 scripts/flutter_to_junit.py \
            test-results/unit-results.json \
            allure-results/unit-junit.xml

      - name: テスト結果をアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-allure-results
          path: allure-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # ② API テスト（Bruno CLI）
  # ──────────────────────────────────────────────
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: unit-test
    # unit-test が失敗しても api-test は実行する
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Node.js セットアップ（Bruno CLI に必要）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bruno CLI インストール
        run: npm install -g @usebruno/cli

      - name: API テスト実行
        # テスト用 Supabase が設定されていない場合も || true で継続する
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          mkdir -p allure-results
          bru run test/api/ \
            --env test \
            --reporter-junit allure-results/api-junit.xml || true

      - name: テスト結果をアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: allure-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # ③ E2E テスト（Flutter Web + Chrome）
  # geolocator は Web 非対応のため、スモークテストのみ実施する
  # ──────────────────────────────────────────────
  e2e-test:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: api-test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: latest

      - name: 依存関係インストール
        run: flutter pub get

      - name: Chrome ドライバ・ChromeDriver セットアップ
        uses: browser-actions/setup-chrome@v1

      - name: Flutter Web 有効化
        run: flutter config --enable-web

      - name: E2E スモークテスト実行
        run: |
          mkdir -p test-results allure-results
          flutter test integration_test/smoke_test.dart \
            -d chrome \
            --reporter json 2>&1 | tee test-results/e2e-results.json || true

      - name: JUnit XML へ変換
        run: |
          python3 scripts/flutter_to_junit.py \
            test-results/e2e-results.json \
            allure-results/e2e-junit.xml

      - name: テスト結果をアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-results
          path: allure-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # ④ 負荷テスト（k6）
  # ──────────────────────────────────────────────
  load-test:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: api-test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: k6 インストール
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: 負荷テスト実行
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          mkdir -p allure-results
          k6 run \
            --out json=allure-results/k6-raw.json \
            --env SUPABASE_TEST_URL="${SUPABASE_TEST_URL}" \
            --env SUPABASE_TEST_ANON_KEY="${SUPABASE_TEST_ANON_KEY}" \
            test/load/load_test.js || true

      - name: テスト結果をアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-allure-results
          path: allure-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # ⑤⑥ Allure Report 生成 → GitHub Pages デプロイ
  # 全ジョブ完了後に必ず実行する
  # ──────────────────────────────────────────────
  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [unit-test, api-test, e2e-test, load-test]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Unit テスト結果をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: unit-allure-results
          path: allure-results/
        continue-on-error: true

      - name: API テスト結果をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results
          path: allure-results/
        continue-on-error: true

      - name: E2E テスト結果をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: e2e-allure-results
          path: allure-results/
        continue-on-error: true

      - name: 負荷テスト結果をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: load-allure-results
          path: allure-results/
        continue-on-error: true

      - name: Java 17 セットアップ（allure-commandline に必要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Allure CLI インストール（v2.27.0）
        run: |
          curl -sSLo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Allure レポート生成
        run: |
          allure generate allure-results --clean -o allure-report || true

      - name: GitHub Pages へデプロイ
        uses: peaceiris/actions-gh-pages@v4
        # main ブランチへの push のみデプロイする（PR では skip）
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - name: レポートをアーティファクトに保存（PR 用）
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # ⑦ Slack 通知
  # Python 標準ライブラリのみ使用（外部アクション不使用）
  # ──────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [unit-test, api-test, e2e-test, load-test, allure-report]
    if: always()
    steps:
      - name: Slack へ結果を通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          UNIT_RESULT: ${{ needs.unit-test.result }}
          API_RESULT: ${{ needs.api-test.result }}
          E2E_RESULT: ${{ needs.e2e-test.result }}
          LOAD_RESULT: ${{ needs.load-test.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse, json

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook:
              print("SLACK_WEBHOOK_URL が未設定のため通知をスキップします")
              exit(0)

          def emoji(result):
              return "✅" if result == "success" else ("⏭️" if result == "skipped" else "❌")

          repo    = os.environ["GITHUB_REPOSITORY"]
          branch  = os.environ["GITHUB_REF_NAME"]
          sha     = os.environ["GITHUB_SHA"][:7]
          unit    = os.environ["UNIT_RESULT"]
          api     = os.environ["API_RESULT"]
          e2e     = os.environ["E2E_RESULT"]
          load    = os.environ["LOAD_RESULT"]

          overall = "✅ 全テスト Pass" if all(
              r in ("success", "skipped") for r in [unit, api, e2e, load]
          ) else "⚠️ 一部テスト失敗"

          report_url = f"https://{repo.split('/')[0]}.github.io/{repo.split('/')[1]}/"

          text = (
              f"{overall}\n"
              f"Branch: `{branch}` | Commit: `{sha}`\n"
              f"{emoji(unit)} Unit/Widget\n"
              f"{emoji(api)} API\n"
              f"{emoji(e2e)} E2E\n"
              f"{emoji(load)} Load\n"
              f"📊 Report: {report_url}"
          )

          payload = json.dumps({"text": text}).encode()
          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Slack 通知送信完了: {resp.status}")
          EOF
